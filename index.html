<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bee Sweet | Desserts and pastries</title>
<meta name="theme-color" content="#4aa52f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bee Sweet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--green:#4aa52f;--deep:#2b6b21;--bg:#f5f7f2;--surface:#fff;--ink:#17261a;--muted:#667565;--line:#e1e8dc;--accent:#e8762b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a12;--surface:#1a271b;--ink:#eef4ea;--muted:#9fb09b;--line:#2b3d2c}}
:root[data-theme="dark"]{--bg:#111a12;--surface:#1a271b;--ink:#eef4ea;--muted:#9fb09b;--line:#2b3d2c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--green);z-index:20}
button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--green)}
.ib{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;line-height:0;position:relative;flex:none}
.ib svg{display:block;margin:auto;width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo{height:44px;flex:none}
.search{flex:1;min-width:0;height:42px;border-radius:10px;border:0;padding:0 14px;background:#fff;color:#17261a}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
main{max-width:1000px;margin:0 auto;padding:18px 14px 48px}
.banner{position:relative;border-radius:14px;overflow:hidden;margin-bottom:22px;background:var(--deep);color:#fff;aspect-ratio:16/7;min-height:150px}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .6s;display:flex;flex-direction:column;justify-content:center;padding:22px}.slide.on{opacity:1}
.slide img,.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}.dots i.on{background:#fff}
.pic{position:relative}.off{position:absolute;top:8px;left:8px;background:#d32f2f;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.was{color:var(--muted);text-decoration:line-through;text-decoration-color:#d32f2f;text-decoration-thickness:2px;font-weight:500;font-size:13px;margin-right:6px}
.banner h1{margin:0 0 6px;font-size:24px;font-weight:700;line-height:1.2}.banner p{margin:0;opacity:.85}
h2.sec{font-size:18px;margin:0 0 12px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.chip{white-space:nowrap;padding:8px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:4/3;background:linear-gradient(135deg,#e6efe0,#d3e3cb);display:grid;place-items:center;color:#7b9473;font-size:12px;font-weight:600}
.cb{padding:12px;display:flex;flex-direction:column;gap:3px;flex:1}
.cb small{color:var(--muted);font-size:12px}.cb h3{margin:0;font-size:15px;font-weight:600}
.price{font-weight:700}.stock{font-size:12px;color:var(--muted)}.stock.low{color:var(--accent);font-weight:600}
.btn{padding:11px 14px;border-radius:8px;background:var(--deep);color:#fff;font-weight:600;width:100%}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.card .btn{margin-top:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{margin:0 0 8px;font-size:19px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.muted{color:var(--muted);font-size:13px}
.tag{padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}
.t-Pending{background:#ececec;color:#444}.t-Processing{background:#fff1cf;color:#7a5600}.t-Delivered{background:#dcf1d4;color:#1f5f15}
.scrim{position:fixed;inset:0;background:rgba(10,20,10,.5);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;background:var(--surface);z-index:31;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 18px;transition:transform .3s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;overflow:auto;box-shadow:0 0 30px rgba(0,0,0,.25)}
#menu{left:0;width:min(84vw,310px);transform:translateX(-105%)}#cart{right:0;width:min(94vw,390px);transform:translateX(105%)}
#menu.on,#cart.on{transform:none}
.dh{background:var(--green);border-radius:10px;padding:8px 12px;margin-bottom:12px;align-self:stretch;display:flex;align-items:center;gap:10px}.dh img{height:50px}.dh::after{content:"Bee Sweet";color:#fff;font-weight:700;font-size:22px;letter-spacing:.2px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;color:var(--ink);font-weight:600;padding:8px 4px;margin-bottom:8px}
textarea.in{height:90px;padding:10px 12px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:13px 12px;border-radius:8px;background:none;font-weight:600;font-size:15px}
.nav[aria-current=page]{background:var(--bg);color:var(--deep)}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;transition:transform .25s}
.nav[aria-expanded=true] svg{transform:rotate(180deg)}
.sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}.sub.on{grid-template-rows:1fr}
.sub>div{overflow:hidden}.sub button{display:block;width:100%;text-align:left;padding:10px 12px 10px 28px;background:none;font-size:13px;font-weight:600;letter-spacing:.2px;color:var(--muted);border-radius:8px}
.sub button:hover{color:var(--deep);background:var(--bg)}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:14px;background:rgba(10,20,10,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.modal.on{opacity:1;pointer-events:auto}.modal .panel{width:100%;max-width:440px;max-height:92vh;overflow:auto;transform:translateY(14px);transition:transform .25s}
.modal.on .panel{transform:none}
label.f{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
.in{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--bg);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.seg button{padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.seg button[aria-pressed=true]{border-color:var(--deep);background:var(--deep);color:#fff}
.pm{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.pm.on{border-color:var(--deep)}.pm.off{opacity:.55}
.acct{background:var(--bg);border-radius:8px;padding:12px;margin:8px 0;line-height:1.6;font-size:14px}
.up{display:block;border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;font-size:14px}
.ok{color:#2b7a1f;font-weight:700;margin:8px 0 0}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:28px;height:28px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.google{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:10px}
.sp{height:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:8px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
.toast.on{opacity:1}.empty{text-align:center;color:var(--muted);padding:24px 0}
.link{display:flex;gap:10px}.link .btn{flex:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.vsel{height:38px;margin:4px 0 2px;font-size:14px;padding:0 8px}
</style></head>
<body>
<header>
<button class="ib" id="mb" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<img class="logo" src="icons/logo.png" alt="Logo">
<input class="search" id="q" type="search" placeholder="Search products" aria-label="Search products">
<button class="ib" id="cb" aria-label="Open cart"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 10.5a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 8H6"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg><span class="badge" id="cn">0</span></button>
</header>
<main id="view"></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="menu" aria-label="Menu"></aside>
<aside class="drawer" id="cart" aria-label="Cart"></aside>
<div class="modal" id="auth"><div class="panel" id="authp"></div></div>
<div class="modal" id="co"><div class="panel" id="cop"></div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
// ---- Admin-controlled values (will come from the back end) ----
let DELIVERY_FEE=1500;
const PROMO={live:false,percent:0}; // admin: set live true/false and the percentage
const BANNER_MEDIA=[]; // admin uploads: {type:'image'|'video',src:'...'}; empty shows the default text banner
const MEDIA_RULES={image:['png','jpg','jpeg','webp','heic','heif','gif'],video:['mp4','mov'],maxVideoMB:20};
function checkMedia(f){const ext=f.name.split('.').pop().toLowerCase();if(MEDIA_RULES.video.includes(ext))return f.size<=MEDIA_RULES.maxVideoMB*1048576?'video':'Video must be under 20 MB';return MEDIA_RULES.image.includes(ext)?'image':'Unsupported file type'}
const SOCIAL={tiktok:'',instagram:''}; // empty = not live yet
const CONTACT={call:'+234 000 000 0000',wa:'+234 000 000 0000',email:'hello@example.com'};
const ACCT={bank:'Bank name',name:'Account name',no:'0123456789'};
const CATS=['Premium Parfait','Shawarma','Juice','Greek Yogurt','Drinking Yogurt','Pastries','Banana Bread','Meat Specials','Extras'];
const P=[];let id=1;
let cat='All',term='',page='home',cart={},user=null,orders=[],mode='signup',recvd=false,ship='pickup',orderNo=1001,authNext=null;
const $=s=>document.querySelector(s),money=n=>'₦'+n.toLocaleString();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API=(window.API_BASE||'').replace(/\/$/,'');
let token=localStorage.getItem('bs_token')||'',dip=null,rfile=null,ckd={name:'',phone:'',addr:''};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;menu()});
async function api(path,o={}){const h={};if(token)h.Authorization='Bearer '+token;let body=o.body;if(o.json){h['Content-Type']='application/json';body=JSON.stringify(o.json)}
const r=await fetch(API+path,{method:o.method||'GET',headers:h,body});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Something went wrong. Please try again.');return d}
const U=u=>u?(/^https?:/.test(u)?u:API+u):null;
async function loadShop(){const d=await api('/api/shop');P.length=0;P.push(...d.products.map(x=>({...x,s:x.a?999:0,img:U(x.img)})));DELIVERY_FEE=d.deliveryFee;Object.assign(PROMO,d.promo);Object.assign(SOCIAL,d.social);Object.assign(CONTACT,d.contact);Object.assign(ACCT,d.account);BANNER_MEDIA.length=0;BANNER_MEDIA.push(...d.banner.map(b=>({type:b.type,src:U(b.src)})))}
async function loadMe(){if(!token)return;try{const d=await api('/api/me');user=d.email;orders=d.orders}catch(e){if(/log in/i.test(e.message)){token='';localStorage.removeItem('bs_token');user=null}}}
async function doAuth(){const em=$('#em').value.trim(),pw=$('#pw').value;if(!/^\S+@\S+\.\S+$/.test(em))return toast('Enter a valid email address');if(pw.length<6)return toast('Password must be at least 6 characters');
try{const d=await api('/api/auth/'+(mode==='signup'?'signup':'login'),{method:'POST',json:{email:em,password:pw}});if(d.role==='admin')throw new Error('Please use the admin page to log in as admin');token=d.token;localStorage.setItem('bs_token',token);user=d.email;orders=d.orders||[];modal('auth',false);const n=authNext;authNext=null;n&&n();render();toast('Signed in')}catch(e){toast(e.message)}}
function keep(){const g=i=>$('#'+i)?$('#'+i).value.trim():null,n=g('cname'),p=g('cphone'),a=g('ad');if(n!==null)ckd.name=n;if(p!==null)ckd.phone=p;if(a!==null)ckd.addr=a}
function payload(){keep();if(ckd.name.length<2){toast('Enter your name');return null}if(ckd.phone.replace(/\D/g,'').length<7){toast('Enter a valid phone number');return null}if(ship==='delivery'&&!ckd.addr){toast('Enter your delivery address');return null}
return {name:ckd.name,phone:ckd.phone,ship,address:ckd.addr,items:Object.keys(cart).filter(k=>cart[k]>0).map(k=>{const[id,vi]=k.split('~'),x=P.find(p=>p.id==id);return{id:+id,qty:cart[k],v:vi!==undefined&&x&&x.v&&x.v[+vi]?x.v[+vi].n:undefined}})}}
async function placeTransfer(){const p=payload();if(!p)return;if(!rfile)return toast('Upload your payment receipt');const fd=new FormData();fd.append('data',JSON.stringify(p));fd.append('receipt',rfile);
$('#buy').disabled=true;try{const d=await api('/api/orders/transfer',{method:'POST',body:fd});orders.unshift(d.order);cart={};await loadShop();modal('co',false);page='orders';render();toast('Order placed. We’ll confirm your payment shortly.')}catch(e){toast(e.message);$('#buy').disabled=false}}
async function payPaystack(ch){const p=payload();if(!p)return;p.channel=ch;toast('Opening secure payment…');try{const d=await api('/api/orders/paystack',{method:'POST',json:p});location.href=d.url}catch(e){toast(e.message)}}
async function sendBooking(b){try{await api('/api/bookings',{method:'POST',json:b});cSent=true;render();scrollTo(0,0);toast('Booking request sent')}catch(e){toast(e.message)}}
async function handleReturn(){const q=new URLSearchParams(location.search),ref=q.get('reference')||q.get('trxref');if(!ref)return;history.replaceState({},'',location.pathname);if(!token)return;
try{const d=await api('/api/paystack/verify?reference='+encodeURIComponent(ref));await loadMe();await loadShop();if(d.paid)cart={};page='orders';render();toast(d.paid?'Payment successful. Thank you!':'Payment was not completed')}catch(e){toast(e.message)}}
const sel={},_rk={},rk=id=>_rk[id]??=Math.random();
function L(k){const[id,vi]=String(k).split('~'),x=P.find(p=>p.id==id);if(!x)return{n:'Item',p:0,s:0};const v=vi!==undefined?(x.v||[])[+vi]:null;return{id:x.id,n:v?x.n+' ('+v.n+')':x.n,p:v&&v.p!=null?v.p:x.p,s:(x.s>0&&(!v||v.a))?999:0}}
function cardHTML(x){const hv=x.v&&x.v.length,i=hv?(sel[x.id]!==undefined&&x.v[sel[x.id]]?sel[x.id]:Math.max(0,x.v.findIndex(q=>q.a))):0,vr=hv?x.v[i]:null,eff={p:vr&&vr.p!=null?vr.p:x.p},ok=x.s>0&&(!hv||vr.a);
return `<div class="card"><div class="pic">${x.img?`<img src="${x.img}" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:'Photo'}${PROMO.live?`<span class="off">-${PROMO.percent}%</span>`:''}</div><div class="cb"><small>${esc(x.c)}</small><h3>${esc(x.n)}</h3>
${hv?`<select class="in vsel" data-vsel="${x.id}" aria-label="Choose an option">${x.v.map((q,j)=>`<option value="${j}" ${j===i?'selected':''}>${esc(q.n)}${q.a?'':' (out of stock)'}</option>`).join('')}</select>`:''}
<div>${priceHTML(eff)}</div><span class="stock ${ok?'':'low'}">${ok?'Available':'Out of stock'}</span>
<button class="btn" data-add="${x.id}" ${ok?'':'disabled'}>${ok?'Add to cart':'Out of stock'}</button></div></div>`}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.vsel){sel[t.dataset.vsel]=+t.value;render()}});
const chev='<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function drawer(i,on){$('#'+i).classList.toggle('on',on);$('#scrim').classList.toggle('on',on)}
function closeAll(){['menu','cart'].forEach(i=>$('#'+i).classList.remove('on'));$('#scrim').classList.remove('on')}
function modal(i,on){$('#'+i).classList.toggle('on',on)}
const inCart=x=>cart[x.id]||0, unit=x=>PROMO.live?Math.round(x.p*(100-PROMO.percent)/100):x.p, total=()=>Object.keys(cart).reduce((t,k)=>cart[k]>0?t+cart[k]*unit(L(k)):t,0);
const priceHTML=x=>PROMO.live?`<span class="was">${money(x.p)}</span><span class="price">${money(unit(x))}</span>`:`<span class="price">${money(x.p)}</span>`;
const EVENTS=['Wedding ceremony','Birthday party','Conference','Church event','Burial ceremony','Baby shower','Bridal shower','Corporate event','Other'];
const SERVICES=['Food services','Dessert services','Food and dessert services'];
const BOOKINGS=[];let cSent=false;
function cateringHTML(){
if(cSent)return `<div class="panel"><h2>Booking request sent</h2><p class="muted">Thank you. Our team will contact you by phone or email to confirm the details.</p><button class="btn" id="newbook">Make another booking</button></div>`;
return `<div class="panel"><h2>Book us</h2><div class="muted">Tell us about your event and we’ll get in touch.</div>
<label class="f" for="c_name">Name</label><input class="in" id="c_name" autocomplete="name">
<label class="f" for="c_email">Email address</label><input class="in" id="c_email" type="email" autocomplete="email" value="${user||''}">
<label class="f" for="c_phone">Phone number</label><input class="in" id="c_phone" type="tel" autocomplete="tel">
<label class="f" for="c_event">Type of event</label><select class="in" id="c_event"><option value="">Select event type</option>${EVENTS.map(e=>`<option>${e}</option>`).join('')}</select>
<label class="f" for="c_service">Our service</label><select class="in" id="c_service"><option value="">Select a service</option>${SERVICES.map(e=>`<option>${e}</option>`).join('')}</select>
<div class="two"><div><label class="f" for="c_date">Event date</label><input class="in" id="c_date" type="date"></div><div><label class="f" for="c_time">Time</label><input class="in" id="c_time" type="time"></div></div>
<label class="f" for="c_venue">Venue and location</label><input class="in" id="c_venue" placeholder="Venue name, area, city">
<label class="f" for="c_notes">Other event details</label><textarea class="in" id="c_notes" placeholder="Number of guests, menu ideas, anything we should know"></textarea>
<div class="sp"></div><button class="btn" id="csend">Send booking request</button></div>`}
let bt;function bannerHTML(){const m=BANNER_MEDIA.length?BANNER_MEDIA.map(b=>b.type==='video'?`<div class="slide"><video src="${b.src}" muted playsinline preload="metadata"></video></div>`:`<div class="slide"><img src="${b.src}" alt=""></div>`):[`<div class="slide"><h1>${PROMO.live?PROMO.percent+'% off everything':'Freshly made, ready when you are.'}</h1><p>Order for pickup or delivery.</p></div>`];return `<div class="banner">${m.join('')}${m.length>1?`<div class="dots">${m.map(()=>'<i></i>').join('')}</div>`:''}</div>`}
function startBanner(){clearTimeout(bt);const s=[...document.querySelectorAll('.slide')],d=[...document.querySelectorAll('.dots i')];if(!s.length)return;let i=0;const show=n=>{i=n;s.forEach((e,k)=>{e.classList.toggle('on',k===n);const v=e.querySelector('video');if(v&&k!==n)v.pause()});d.forEach((e,k)=>e.classList.toggle('on',k===n));const nx=()=>show((n+1)%s.length),v=s[n].querySelector('video');if(v){v.currentTime=0;v.play().catch(()=>{});v.onended=nx;v.onerror=nx}else if(s.length>1)bt=setTimeout(nx,5000)};show(0)}
function menu(){
$('#menu').innerHTML=`<div class="dh"><img src="icons/logo.png" alt="Logo"></div>
<button class="nav" data-go="home" ${page==='home'?'aria-current="page"':''}>Home</button>
<button class="nav" id="catbtn" aria-expanded="${catOpen}">Categories ${chev}</button>
<div class="sub ${catOpen?'on':''}"><div>${CATS.map(c=>`<button data-cat="${c}">${c.toUpperCase()}</button>`).join('')}</div></div>
<button class="nav" data-go="orders" ${page==='orders'?'aria-current="page"':''}>My orders</button>
<button class="nav" data-go="catering" ${page==='catering'?'aria-current="page"':''}>Catering service</button>
<button class="nav" data-go="contact" ${page==='contact'?'aria-current="page"':''}>Contact us</button>
${dip?'<button class="nav" id="install">Install app</button>':''}
${user?`<div style="margin-top:auto" class="muted">Signed in as ${user}</div><button class="nav" id="out">Log out</button>`:`<button class="btn" id="signin" style="margin-top:auto">Sign up or log in</button>`}`}
let catOpen=false;
function render(){
const v=$('#view');
if(page==='home'){
let list=P.filter(x=>(cat==='All'||x.c===cat)&&x.n.toLowerCase().includes(term));
if(cat==='All'&&!term)list=list.filter(x=>x.s>0).sort((a,b)=>rk(a.id)-rk(b.id)).slice(0,8);
v.innerHTML=`${cat==='All'&&!term?bannerHTML():''}
<h2 class="sec">${term?'Search results':cat==='All'?'Suggested for you':cat}</h2>

<div class="grid">${list.map(cardHTML).join('')||'<div class="empty">No products match your search.</div>'}</div>`}
else if(page==='orders'){
v.innerHTML=`<div class="panel"><h2>My orders</h2>${!user?'<div class="empty">Log in to see your orders.<div class="sp"></div><button class="btn" data-needauth="1" style="max-width:220px">Log in</button></div>':orders.length?orders.map(o=>`<div class="row"><div><b>Order #${o.id}</b> <span class="muted">· ${o.ship}</span><div class="muted">${o.items}</div><b>${money(o.total)}</b></div><span class="tag t-${o.st}">${o.st}</span></div>`).join(''):'<div class="empty">You haven’t placed any orders yet.</div>'}</div>`}
else if(page==='catering')v.innerHTML=cateringHTML();
else{
const lk=(k,l)=>SOCIAL[k]?`<a class="btn" style="text-align:center;text-decoration:none;display:block" href="${SOCIAL[k]}" target="_blank" rel="noopener">${l}</a>`:`<button class="btn" disabled title="Not live yet">${l}</button>`;
v.innerHTML=`<div class="panel"><h2>Contact us</h2>
<div class="row"><div><b>Calls only</b><div class="muted">${CONTACT.call}</div></div><a class="tag t-Delivered" href="tel:${CONTACT.call.replace(/\s/g,'')}">Call</a></div>
<div class="row"><div><b>WhatsApp only</b><div class="muted">${CONTACT.wa}</div></div><a class="tag t-Delivered" href="https://wa.me/${CONTACT.wa.replace(/\D/g,'')}" target="_blank" rel="noopener">Chat</a></div>
<div class="row"><div><b>Email</b><div class="muted">${CONTACT.email}</div></div><a class="tag t-Delivered" href="mailto:${CONTACT.email}">Email</a></div>
<div class="sp"></div><div class="link">${lk('tiktok','TikTok')}${lk('instagram','Instagram')}</div></div>`}
if(page!=='home'||cat!=='All'||term)v.insertAdjacentHTML('afterbegin','<button class="back" id="back">‹ Back</button>');
renderCart();menu();if(page==='home')startBanner()}
function renderCart(){
const ids=Object.keys(cart).filter(k=>cart[k]>0);
$('#cn').textContent=ids.reduce((t,k)=>t+cart[k],0);
$('#cart').innerHTML=`<h2 style="margin:0 0 8px;font-size:19px">Your cart</h2><div style="flex:1">${ids.length?ids.map(k=>{const x=L(k);return `<div class="row"><div><b>${x.n}</b><div class="muted">${PROMO.live?`<span class="was">${money(x.p)}</span>`:''}${money(unit(x))} each</div></div><div class="qty"><button data-dec="${k}" aria-label="Remove one">−</button>${cart[k]}<button data-inc="${k}" aria-label="Add one" ${cart[k]>=x.s?'disabled':''}>+</button></div></div>`}).join(''):'<div class="empty">Your cart is empty.</div>'}</div>
<div class="row" style="border:0"><b>Subtotal</b><b>${money(total())}</b></div><button class="btn" id="tocheckout" ${ids.length?'':'disabled'}>Checkout</button>`}
function authView(){
const su=mode==='signup';
$('#authp').innerHTML=`<h2>${su?'Create your account':'Log in'}</h2><div class="muted">${su?'Sign up to place your order.':'Log in to place your order.'}</div>
<label class="f" for="em">Email</label><input class="in" id="em" type="email" autocomplete="email">
<label class="f" for="pw">Password</label><input class="in" id="pw" type="password" autocomplete="${su?'new-password':'current-password'}">
<div class="sp"></div><button class="btn" id="authgo">${su?'Sign up':'Log in'}</button>
<button class="btn ghost google" id="gg" style="margin-top:8px">Continue with Google</button>
<button class="nav" id="swap" style="justify-content:center;margin-top:6px">${su?'I already have an account':'Create a new account'}</button>
<button class="nav" id="authx" style="justify-content:center">Cancel</button>`}
function needAuth(next){if(user)return true;authNext=next;mode='signup';authView();modal('auth',true);return false}
function checkout(){rfile=null;const fee=ship==='delivery'?DELIVERY_FEE:0,tot=total()+fee;
const items=Object.keys(cart).filter(k=>cart[k]>0).map(k=>{const x=L(k);return `<div class="row"><span>${cart[k]} × ${esc(x.n)}</span><b>${money(unit(x)*cart[k])}</b></div>`}).join('');
$('#cop').innerHTML=`<h2>Checkout</h2>${items}
<label class="f" for="cname">Full name</label><input class="in" id="cname" autocomplete="name" value="${esc(ckd.name)}">
<label class="f" for="cphone">Phone number</label><input class="in" id="cphone" type="tel" autocomplete="tel" value="${esc(ckd.phone)}">
<div class="seg"><button data-ship="pickup" aria-pressed="${ship==='pickup'}">Pickup</button><button data-ship="delivery" aria-pressed="${ship==='delivery'}">Delivery</button></div>
${ship==='delivery'?`<div class="row"><span>Delivery fee</span><b>${money(DELIVERY_FEE)}</b></div><label class="f" for="ad">Delivery address</label><input class="in" id="ad" placeholder="Street, area, city" value="${esc(ckd.addr)}">`:''}
<div class="row"><b>Total</b><b>${money(tot)}</b></div>
<h2 style="margin-top:14px;font-size:16px">Pay online</h2>
<button class="btn" data-pay="all">Pay with Paystack</button>
<button class="btn ghost" data-pay="card" style="margin-top:8px">Pay with debit or credit card</button>
<h2 style="margin-top:14px;font-size:16px">Or pay by bank transfer</h2>
<div class="acct">${esc(ACCT.bank)}<br>${esc(ACCT.name)}<br><b>${esc(ACCT.no)}</b> · Amount: <b>${money(tot)}</b></div>
<button class="btn ghost" id="copy" style="margin-bottom:8px">Copy account number</button>
<label class="up" id="uplab"><span id="uptxt">Upload payment receipt</span><input type="file" accept="image/*,.heic,.pdf" id="file" hidden></label>
<div id="vmsg"></div>
<button class="btn" id="buy" disabled style="margin-top:12px">Purchase</button>
<button class="nav" id="cox" style="justify-content:center">Back</button>`;
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>10*1048576){e.target.value='';return toast('Receipt must be under 10 MB')}rfile=f;$('#uptxt').textContent=f.name;$('#vmsg').innerHTML='<div class="muted" style="margin-top:8px">Receipt attached. We will verify your payment and confirm your order.</div>';$('#buy').disabled=false}}
document.addEventListener('click',e=>{
const t=e.target.closest('button,#scrim');if(!t)return;const d=t.dataset;
if(d.cat){cat=d.cat;page='home';term='';$('#q').value='';closeAll();render();scrollTo(0,0)}
else if(d.add){const x=P.find(p=>p.id==d.add),vi=(x.v&&x.v.length)?(sel[x.id]!==undefined&&x.v[sel[x.id]]?sel[x.id]:Math.max(0,x.v.findIndex(q=>q.a))):null,key=vi===null?String(x.id):x.id+'~'+vi;if(vi!==null&&!x.v[vi].a)return toast('That option is out of stock');if(!needAuth(()=>{cart[key]=(cart[key]||0)+1;render();toast('Added to cart')}))return;cart[key]=(cart[key]||0)+1;toast('Added to cart');render()}
else if(d.pay){payPaystack(d.pay)}
else if(t.id==='install'){if(dip){dip.prompt();dip=null}closeAll();menu()}
else if(d.inc){cart[d.inc]++;render()}
else if(d.dec){cart[d.dec]--;render()}
else if(d.go){page=d.go;closeAll();render();if(page==='orders'&&user)loadMe().then(render)}
else if(d.needauth){needAuth(null)}
else if(d.ship){keep();ship=d.ship;checkout()}
else if(t.id==='back'){if(page==='home'){cat='All';term='';$('#q').value=''}else page='home';render();scrollTo(0,0)}
else if(t.id==='newbook'){cSent=false;render()}
else if(t.id==='csend'){const g=i=>$('#'+i).value.trim(),b={name:g('c_name'),email:g('c_email'),phone:g('c_phone'),event:g('c_event'),service:g('c_service'),date:g('c_date'),time:g('c_time'),venue:g('c_venue'),notes:g('c_notes')};
if(!b.name)return toast('Enter your name');if(!/^\S+@\S+\.\S+$/.test(b.email))return toast('Enter a valid email address');if(b.phone.replace(/\D/g,'').length<7)return toast('Enter a valid phone number');if(!b.event)return toast('Select the type of event');if(!b.service)return toast('Select a service');if(!b.date||!b.venue)return toast('Add the event date and venue');
sendBooking(b)}
else if(t.id==='mb')drawer('menu',true);
else if(t.id==='cb')drawer('cart',true);
else if(t.id==='scrim')closeAll();
else if(t.id==='catbtn'){catOpen=!catOpen;menu()}
else if(t.id==='signin'){closeAll();needAuth(null)}
else if(t.id==='out'){user=null;orders=[];token='';localStorage.removeItem('bs_token');closeAll();render();toast('Logged out')}
else if(t.id==='swap'){mode=mode==='signup'?'login':'signup';authView()}
else if(t.id==='authx')modal('auth',false);
else if(t.id==='gg')toast('Google sign-in will be connected later');
else if(t.id==='authgo'){doAuth()}
else if(t.id==='tocheckout'){if(!needAuth(null))return;closeAll();ship='pickup';checkout();modal('co',true)}
else if(t.id==='cox')modal('co',false);
else if(t.id==='copy'){try{navigator.clipboard.writeText(ACCT.no)}catch(_){}toast('Account number copied')}
else if(t.id==='buy'){placeTransfer()}});
$('#q').addEventListener('input',e=>{term=e.target.value.trim().toLowerCase();cat='All';page='home';render()});
(async()=>{try{await loadShop()}catch(e){toast('Could not load products. Check your connection.')}await loadMe();render();handleReturn()})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body></html>
